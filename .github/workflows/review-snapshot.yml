name: Final review snapshot
on:
  push:
    branches: [feat/fal-migration]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=/tmp/fal-final-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: fal-final-source
          path: /tmp/fal-final-source.tar.gz
          retention-days: 1
