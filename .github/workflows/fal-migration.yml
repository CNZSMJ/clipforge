name: Fal migration verification

on:
  push:
    branches: [feat/fal-migration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fal-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source for reproducible review
        run: git archive --format=tar.gz --output=review-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: migration-review-source
          path: review-source.tar.gz
          retention-days: 3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Regression tests
        if: success() || failure()
        run: pnpm test
      - name: Production build
        if: success() || failure()
        run: pnpm build
