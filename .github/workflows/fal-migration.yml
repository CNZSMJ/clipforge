name: Fal migration verification
on:
  push:
    branches: [feat/fal-migration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fal-migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Export offline test dependencies (temporary audit snapshot)
        run: |
          tar -czf review-dependencies.tar.gz --exclude='node_modules/.pnpm/onnxruntime*' --exclude='node_modules/.pnpm/@huggingface*' --exclude='node_modules/.pnpm/@next+swc*' --exclude='node_modules/.pnpm/@img+sharp*' --exclude='node_modules/.pnpm/electron@*' --exclude='*/ffmpeg-static/ffmpeg' --exclude='*/ffprobe-linux-*/bin/ffprobe' node_modules
      - name: Fetch public model contracts (no inference calls or credentials)
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, pathlib, re, urllib.request, urllib.parse
          root = pathlib.Path('src/lib/providers')
          ids = set(re.findall(r"id:\s*'([^']+/[^']+)'", (root/'fal-ai.ts').read_text()))
          for name in ['fal-video-params.ts', 'fal-image-params.ts']:
              ids.update(re.findall(r"'([^'\n]+/[^'\n]+)'\s*:\s*\{", (root/name).read_text()))
          ids.add('openrouter/router')
          def fetch(endpoint):
              try:
                  url = 'https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=' + urllib.parse.quote(endpoint, safe='')
                  with urllib.request.urlopen(url, timeout=40) as response:
                      return endpoint, {'schema': json.load(response)}
              except Exception as error:
                  return endpoint, {'error': str(error)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              data = dict(pool.map(fetch, sorted(ids)))
          pathlib.Path('review-fal-schemas.json').write_text(json.dumps(data))
          print('Public schema endpoints inspected:', len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: migration-review-environment
          path: |
            review-dependencies.tar.gz
            review-fal-schemas.json
          retention-days: 1
      - name: Lint
        run: pnpm lint
      - name: Regression tests
        if: success() || failure()
        run: pnpm test
      - name: Production build
        if: success() || failure()
        run: pnpm build
