name: Verify storyboard prompt optimization
on:
  push:
    branches: [feat/fal-migration]
    paths:
      - .github/storyboard-review/**
      - .github/apply-storyboard-review.py
      - .github/workflows/storyboard-review.yml
permissions:
  contents: read
concurrency:
  group: storyboard-prompt-review
  cancel-in-progress: false
env:
  EXPECTED_TREE: 317e79041611e7aec062e8d6ec620e3e4f9a00a5
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  verify:
    if: github.repository == 'CNZSMJ/clipforge' && github.ref == 'refs/heads/feat/fal-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply reviewed source and verify exact candidate tree
        run: |
          python3 .github/apply-storyboard-review.py
          git add -A
          git diff --cached --check
          git write-tree > /tmp/storyboard-tree.txt
          test "$(cat /tmp/storyboard-tree.txt)" = "$EXPECTED_TREE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: set -o pipefail; pnpm lint 2>&1 | tee /tmp/storyboard-lint.log
      - name: Full regression suite (no live inference)
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=/tmp/storyboard-tests.json
      - name: Production build
        run: set -o pipefail; pnpm build 2>&1 | tee /tmp/storyboard-build.log
      - name: Confirm verification did not alter tracked source
        run: |
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-prompt-verification
          retention-days: 14
          path: |
            /tmp/storyboard-tests.json
            /tmp/storyboard-build.log
            /tmp/storyboard-lint.log
            /tmp/storyboard-tree.txt
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Publish exactly the tested tree without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 .github/apply-storyboard-review.py
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/feat/fal-migration | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(storyboard): specialize creative prompts and preserve cross-shot intent' -m "Research-backed direction for 10 commerce and 5 topic styles, four production-mode boundaries, voice/visibility metadata, and coherent planning/keyframe/motion/grid/film/judge prompts. Existing balanced models and paid-call count preserved. Typecheck, lint, 1611 tests and production build verified for exact tree $EXPECTED_TREE. No live inference or visual-uplift claim. Temporary review workflows removed."
          git push origin HEAD:refs/heads/feat/fal-migration
          echo "Published $(git rev-parse HEAD); verified tree $EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
