# CI 流水线：push / PR 自动跑 lint + 单测 + 生产构建
name: CI

on:
  push:
    branches: [main, feat/fal-migration]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Reproducible, tracked-files-only snapshot for the migration audit. No secrets,
      # working files, dependencies or credentials are included in git archive.
      - name: Export migration review snapshot
        if: github.ref == 'refs/heads/feat/fal-migration'
        run: git archive --format=tar.gz --output=review-source.tar.gz HEAD

      - name: Retain migration review snapshot
        if: github.ref == 'refs/heads/feat/fal-migration'
        uses: actions/upload-artifact@v4
        with:
          name: migration-review-source
          path: review-source.tar.gz
          retention-days: 3

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 配置 Node 22（启用 pnpm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装系统 ffmpeg（供 drawtext 真渲染测试回退使用）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: 安装依赖（锁定版本，开箱即用）
        run: pnpm install --frozen-lockfile

      - name: 代码规范检查
        run: pnpm lint

      - name: 单元测试
        if: success() || failure()
        run: pnpm test

      - name: 生产构建
        if: success() || failure()
        run: pnpm build
