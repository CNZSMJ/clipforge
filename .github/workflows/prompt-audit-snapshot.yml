name: Storyboard prompt audit snapshot
on:
  push:
    branches: [feat/fal-migration]
    paths: [.github/workflows/prompt-audit-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'CNZSMJ/clipforge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=prompt-audit-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: prompt-audit-source
          path: prompt-audit-source.tar.gz
          retention-days: 2
