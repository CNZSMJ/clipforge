name: Export verified keyframe blobs
on:
  push:
    branches: [feat/fal-migration]
    paths: [.github/workflows/keyframe-review.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruct the already-tested exact source tree
        run: python3 .github/apply-keyframe-review.py
      - name: Export non-workflow blobs without committing or updating refs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          api = 'https://api.github.com/repos/CNZSMJ/clipforge'
          def request(path, data=None):
              req = urllib.request.Request(api + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                    'Accept':'application/vnd.github+json','Content-Type':'application/json',
                    'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          verified = request('/actions/runs/35277752986/jobs?per_page=100')['jobs']
          if not any(j['name']=='verify' and j['conclusion']=='success' for j in verified):
              raise RuntimeError('Source verification did not pass')
          parent = os.environ['EXPECTED_HEAD']
          if request('/git/ref/heads/feat/fal-migration')['object']['sha'] != parent:
              raise RuntimeError('Concurrent feature change')
          expected = '947ac6dd7b748a2af93d3048fc6941f53cb52161'
          if subprocess.check_output(['git','write-tree'],text=True).strip() != expected:
              raise RuntimeError('Source differs from verified tree')
          fields = subprocess.check_output(['git','diff','--cached','--name-status','--no-renames','-z','HEAD']).decode().split('\0')
          entries = []
          for i in range(0,len(fields)-1,2):
              status, name = fields[i:i+2]
              if status == 'D':
                  entries.append({'path':name,'mode':'100644','type':'blob','sha':None})
                  continue
              mode, sha = subprocess.check_output(['git','ls-files','--stage','--',name],text=True).split()[:2]
              content = pathlib.Path(name).read_text()
              if name.startswith('.github/workflows/'):
                  # Workflow writes remain with the authorized connector, not this job token.
                  entries.append({'path':name,'mode':mode,'type':'blob','content':content})
                  continue
              actual = request('/git/blobs', {'content':content,'encoding':'utf-8'})['sha']
              if actual != sha: raise RuntimeError('Blob mismatch: '+name)
              entries.append({'path':name,'mode':mode,'type':'blob','sha':sha})
          manifest = {'parent':parent,'base_tree':request('/git/commits/'+parent)['tree']['sha'],
                      'expected_tree':expected,'verified_run':35277752986,'tree':entries}
          pathlib.Path('/tmp/keyframe-git-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print('Exported',len(entries),'entries; no branch or commit was written.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: keyframe-git-manifest
          path: /tmp/keyframe-git-manifest.json
          retention-days: 14
