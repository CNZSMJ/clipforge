name: Keyframe review source
on:
  push:
    branches: [feat/fal-migration]
    paths: [.github/workflows/keyframe-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > /tmp/keyframe-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: keyframe-source
          path: /tmp/keyframe-source.tar.gz
          retention-days: 1
